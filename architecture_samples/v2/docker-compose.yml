version: "3.9"
services:
  etcd:
    image: bitnami/etcd:3.5
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379

  apisix:
    image: apache/apisix:3.9.1-debian
    depends_on:
      - etcd
      - user-service
      - order-service
    ports:
      - "9080:9080"
    volumes:
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    environment:
      APISIX_STAND_ALONE: "true"

  user-service:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn redis && uvicorn app:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./user-service:/app
    environment:
      REDIS_URL: redis://redis:6379/0

  order-service:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn asyncpg redis aio-pika pydantic && uvicorn app:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./order-service:/app
    environment:
      REDIS_URL: redis://redis:6379/1
      WRITE_DSN: postgresql://app_user:app_password@postgres-primary:5432/app_db
      READ_DSN: postgresql://app_user:app_password@postgres-replica:5432/app_db
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - redis
      - postgres-primary
      - postgres-replica
      - rabbitmq

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install aio-pika && python consumer.py"
    volumes:
      - ./worker:/app
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq

  redis:
    image: redis:7.2-alpine

  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password

  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
